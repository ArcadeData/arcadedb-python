# Force-inline the scalar distance path of jvector 4.0.2 (the provider every native image uses: -H:-VectorAPISupport, see
# oracle/graal#14751). Measured with untimed profiles on the baseline image (-march=compatibility), 50k x 128-d L2 graph: ArrayVectorFloat.length,
# a one-line getter, stayed a call and took 31% of the samples; with these filters it takes 0%, the graph build went from 94.2 s to 76.1 s
# and a search from 1.07 ms to 0.89 ms. The dotProduct and cosine entries are the same scalar counterparts for DOT_PRODUCT and COSINE
# indexes (not profiled; the same getters sit in their loops). A filter without a signature matches every overload. This file is read from
# the glue jar on the image build classpath; preview-build.sh fails the build when the log does not show the option as picked up.
# The JDK's XML parser builds its error messages (JAXP00010001, entity limits and every syntax error) from this bundle; without it in the image a parse error
# reads "Could not load any resource bundle by ...XMLMessages" and the entity-limit code is lost (test_native_xml_limits.py).
Args = -H:PriorityForceInline=io.github.jbellis.jvector.vector.ArrayVectorFloat.length,io.github.jbellis.jvector.vector.ArrayVectorFloat.get,io.github.jbellis.jvector.vector.VectorUtil.squareL2Distance,io.github.jbellis.jvector.vector.VectorUtil.dotProduct,io.github.jbellis.jvector.vector.VectorUtil.cosine,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.squareDistance,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.squareDistanceUnrolled,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.dotProduct,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.cosine -H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages
# JEP 498 (JDK 24 and later): the first call of a sun.misc.Unsafe memory method prints "A terminally deprecated method in sun.misc.Unsafe has been called"
# (four lines) to System.initialErr, and jvector's SimpleMappedReader$Supplier makes that call (Unsafe.invokeCleaner) when a vector index is reopened.
# The image writes the text to the stderr handle the runtime cached at start-up: on Windows a database file opened after the host's dup2 onto fd 2 can
# own that handle value and got the four lines (release run 40291551544, a .lsmvecidx file), on Linux the text reaches the host's redirect target.
# sun.misc.Unsafe keeps its option (MemoryAccessOption, from --sun-misc-unsafe-memory-access=allow) in a static final that the image builder folds into
# the image, so it is set for the builder's JVM here (JavaArgs); -Dsun.misc.unsafe.memory.access=allow as an isolate argument at run time does nothing.
# tests/test_log_redirect.py fails on the native build when the text appears again.
JavaArgs = -Dsun.misc.unsafe.memory.access=allow
