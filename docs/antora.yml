name: arcadedb-python
title: ArcadeDB Python
# Unversioned, so the component is published at /arcadedb-python/.
version:
nav:
- modules/ROOT/nav.adoc
asciidoc:
  attributes:
    # Package names. Every page takes them from here. There is no bare pkg-name:
    # a page always says which of the two packages it means.
    # native-pkg-name: the native build (default for embedded use).
    # jvm-pkg-name: the JVM build (heavy, long-running loads, Java-object APIs).
    # Both import as arcadedb.
    native-pkg-name: arcadedb
    jvm-pkg-name: arcadedb-jvm
    import-name: arcadedb
    import-stmt: import arcadedb
    # Other names a reader meets on PyPI (the pages that compare packages use these).
    driver-pkg-name: arcadedb-driver
    grpc-driver-pkg-name: arcadedb-driver-grpc
    community-driver-pkg-name: arcadedb-python
    community-repo-url: https://github.com/stevereiner/arcadedb-python
    repo-url: https://github.com/ArcadeData/arcadedb-python
    native-pypi-url: https://pypi.org/project/arcadedb/
    jvm-pypi-url: https://pypi.org/project/arcadedb-jvm/
    which-package-url: https://github.com/ArcadeData/arcadedb-python/blob/main/docs/modules/ROOT/pages/which-package.adoc
    # The main ArcadeDB manual. Pages link into it as {arcadedb-docs-url}/<page>, not with an
    # arcadedb:: xref, so the component also builds on its own (antora-playbook.yml here).
    arcadedb-docs-url: https://docs.arcadedb.com/arcadedb
