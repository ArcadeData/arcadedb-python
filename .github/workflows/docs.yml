# Builds the docs/ Antora component as a site of its own (docs/antora-playbook.yml) and attaches it
# as the docs-site artifact: the rendered preview of a pull request, and the check a docs-only pull
# request gets (the test workflows ignore docs/** and *.adoc). On main it also deploys the site to
# GitHub Pages, https://arcadedata.com/arcadedb-python/ (the org's Pages domain), because
# docs.arcadedb.com does not publish the component yet (ArcadeData/arcadedb-docs#505).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build with Antora
        # Same version as docs.arcadedb.com (@antora/cli and @antora/site-generator ^3.2.1 in
        # ArcadeData/arcadedb-docs). The playbook fails the build on any warning.
        run: npx --yes -p @antora/cli@3.2.1 -p @antora/site-generator@3.2.1 antora docs/antora-playbook.yml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/build/site
          retention-days: 14
          if-no-files-found: error

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/site

  deploy:
    name: Deploy docs to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      # Pages source "GitHub Actions"; the environment allows deploys from main only.
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
