name: Bug report
description: Something in the Python bindings (arcadedb or arcadedb-jvm) does not work
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which distribution you installed. Both import as `arcadedb`.
      options:
        - arcadedb (native)
        - arcadedb-jvm (JVM)
        - both
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: "`arcadedb.__version__` is enough."
      placeholder: 26.11.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, architecture and Python version
      placeholder: Ubuntu 24.04 x86_64, Python 3.13
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full traceback or error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A short Python script that reproduces the problem raises the chance of a quick fix a lot.
      render: python
    validations:
      required: true
